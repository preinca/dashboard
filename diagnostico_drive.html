<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico Drive multidispositivo</title>
<style>body{font-family:Arial,sans-serif;margin:24px;max-width:900px}button{padding:10px 14px;margin:4px}pre{background:#f5f5f5;padding:14px;white-space:pre-wrap;border:1px solid #ddd;border-radius:8px}.ok{color:#087830}.bad{color:#b42318}</style></head>
<body><h1>Diagnóstico Google Drive</h1><p>URL usada:</p><pre id="url"></pre><button id="jsonp">Probar JSONP</button><button id="iframe">Probar iframe</button><button id="both">Probar ambos</button><button id="health">Abrir health</button><pre id="out">Listo.</pre>
<script src="config.js?v=20260930-v11-2-verificados"></script>
<script>
const out=document.getElementById('out');document.getElementById('url').textContent=window.DASH_DRIVE_API_URL;
function jsonp(timeout=15000){const base=window.DASH_DRIVE_API_URL;return new Promise((resolve,reject)=>{const cb='__diag_'+Date.now()+'_'+Math.random().toString(36).slice(2);const q=new URLSearchParams({action:'read_master',callback:cb,_ts:Date.now()});const s=document.createElement('script');let done=false;const clean=()=>{if(done)return;done=true;clearTimeout(t);try{delete window[cb]}catch(e){}s.remove()};const t=setTimeout(()=>{clean();reject(new Error('Timeout JSONP'))},timeout);window[cb]=a=>{clean();a&&a.ok?resolve(a):reject(new Error(a&&a.error||'Respuesta inválida'))};s.onerror=()=>{clean();reject(new Error('script.onerror cargando Apps Script'))};s.src=base+'?'+q;document.head.appendChild(s)})}
function iframeRead(timeout=30000){const base=window.DASH_DRIVE_API_URL;return new Promise((resolve,reject)=>{const nonce='diag_if_'+Date.now()+'_'+Math.random().toString(36).slice(2);const q=new URLSearchParams({action:'read_master',transport:'iframe',nonce,parentOrigin:location.origin&&location.origin!=='null'?location.origin:'*',_ts:Date.now()});const f=document.createElement('iframe');f.style='position:fixed;left:-9999px;width:1px;height:1px;border:0';let done=false;const clean=()=>{if(done)return;done=true;clearTimeout(t);removeEventListener('message',onmsg);f.remove()};const onmsg=e=>{const m=e.data;if(!m||m.type!=='POLAR_DRIVE_RESPONSE'||m.nonce!==nonce)return;clean();m.payload&&m.payload.ok?resolve(m.payload):reject(new Error(m.payload&&m.payload.error||'Respuesta iframe inválida'))};addEventListener('message',onmsg);const t=setTimeout(()=>{clean();reject(new Error('Timeout iframe'))},timeout);f.onerror=()=>{clean();reject(new Error('No se pudo abrir iframe'))};f.src=base+'?'+q;document.body.appendChild(f)})}
function show(ans,label){const d=ans.data||{};return label+' OK\n'+JSON.stringify({backendVersion:ans.version||'SIN VERSION',backendV11_3:ans.version==='V11.3-2026-10-01',supportsVerifiedVisualReferences:!!ans.supportsVerifiedVisualReferences,spreadsheetName:ans.spreadsheetName,PTAB:(d.PTAB||[]).length,PTAR:(d.PTAR||[]).length,VAPOR:(d.VAPOR||[]).length,SUAVIZADORES:(d.SUAVIZADORES||[]).length,COMPRESORES_REFRIGERACION:(d.COMPRESORES_REFRIGERACION||[]).length,INVENTARIO_QUIMICO:(d.INVENTARIO_QUIMICO||[]).length,LISTA_VERIFICADOS:(d.LISTA_VERIFICADOS||[]).length},null,2)}
async function run(which){out.className='';out.textContent='Probando...';try{if(which==='jsonp'){out.textContent=show(await jsonp(),'JSONP')}else if(which==='iframe'){out.textContent=show(await iframeRead(),'IFRAME')}else{let r=[];try{r.push(show(await jsonp(),'JSONP'))}catch(e){r.push('JSONP ERROR: '+e.message)}try{r.push(show(await iframeRead(),'IFRAME'))}catch(e){r.push('IFRAME ERROR: '+e.message)}out.textContent=r.join('\n\n')}out.className=out.textContent.includes(' OK')?'ok':'bad'}catch(e){out.className='bad';out.textContent='ERROR\n'+e.message}}
document.getElementById('jsonp').onclick=()=>run('jsonp');document.getElementById('iframe').onclick=()=>run('iframe');document.getElementById('both').onclick=()=>run('both');document.getElementById('health').onclick=()=>{const u=window.DASH_DRIVE_API_URL+'?action=health&_ts='+Date.now();window.open(u,'_blank','noopener');};
</script></body></html>
